# Trabalho Final SD - infraestrutura (Etapa 1)
# Kafka (modo KRaft, sem Zookeeper) + cluster Spark (1 master + 2 workers)
#
# Acesso ao Kafka:
#   - de DENTRO dos containers (Spark, etc.): kafka:9092
#   - da SUA MAQUINA (producer/consumer em Python): localhost:29092

name: trabalho_final_sd

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Cria os topicos do projeto e encerra (idempotente: pode rodar varias vezes)
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BIN=/opt/kafka/bin
        $$BIN/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic reservas  --partitions 3 --replication-factor 1
        $$BIN/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic previsoes --partitions 3 --replication-factor 1
        echo "Topicos criados:"
        $$BIN/kafka-topics.sh --bootstrap-server kafka:9092 --list

  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"   # endereco do master (spark://spark-master:7077)

  spark-worker-1:
    image: apache/spark:3.5.3-python3
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
    ports:
      - "8081:8081"

  spark-worker-2:
    image: apache/spark:3.5.3-python3
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
    ports:
      - "8082:8081"

volumes:
  kafka-data:
